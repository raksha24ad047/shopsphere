<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="ShopSphere is a responsive e-commerce product catalog for discovering products across multiple categories.">

    <meta
        name="author"
        content="ShopSphere">

    <title>ShopSphere | Product Catalog</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- ========================================
         HEADER
         ======================================== -->

    <header class="site-header">

        <div class="header-container">

            <a
                href="#home"
                class="logo"
                data-route>
                ShopSphere
            </a>


            <!-- Navigation -->

            <nav aria-label="Main navigation">

                <a
                    href="#home"
                    data-route>
                    Home
                </a>

                <a
                    href="#products"
                    data-route>
                    Products
                </a>

                <a
                    href="#about"
                    data-route>
                    About
                </a>

            </nav>

        </div>

    </header>


    <!-- ========================================
         MAIN APPLICATION
         ======================================== -->

    <main id="app">

        <!-- JavaScript will place page content here -->

    </main>


    <!-- ========================================
         FOOTER
         ======================================== -->

    <footer class="site-footer">

        <p>
            &copy; 2026 ShopSphere. All rights reserved.
        </p>

    </footer>


    <!-- ========================================
         JAVASCRIPT
         ======================================== -->

    <script type="module" src="js/app.js"></script>

</body>

</html>
